[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-servo-tracker"
version = "0.1.0"
description = "Edge-server pan-tilt object tracking system with safe-hold servo control."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "IoT Servo Tracker Team" }
]
dependencies = []

[project.optional-dependencies]
web = ["streamlit>=1.34", "paho-mqtt>=2.0"]
edge = [
  "paho-mqtt>=2.0",
  "pyzmq>=25.0",
  "opencv-python>=4.9",
  "adafruit-circuitpython-servokit>=1.3",
  "adafruit-circuitpython-vl53l0x>=3.6",
]
server = [
  "pyzmq>=25.0",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "pillow>=10.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "packaging>=23.0",
  "ultralytics>=8.4.0",
  "huggingface-hub>=0.23",
  "transformers>=4.57.1",
  "accelerate>=1.10.0",
  "trl>=0.17.0",
  "supervision==0.19.0",
]
dev = ["ruff>=0.4"]

[project.scripts]
iot-edge = "iot_servo_tracker.edge.main:main"
iot-server = "iot_servo_tracker.server.main:main"
iot-simulate = "iot_servo_tracker.edge.main:simulate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
